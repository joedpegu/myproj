<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .bio {
            margin-bottom: 30px;
        }
        .gallery img {
            width: 30%;
            margin: 1%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bio">
            <img src="profile.jpg" alt="Profile Picture" class="profile-pic">
            <h1>Your Name</h1>
            <p>Write a brief professional or personal biography here. This section introduces who you are and what you do.</p>
        </div>
        
        <hr>
        
        <h2>Gallery</h2>
        <div class="gallery">
            <img src="pic1.jpg" alt="Gallery Image 1">
            <img src="pic2.jpg" alt="Gallery Image 2">
            <img src="pic3.jpg" alt="Gallery Image 3">
        </div>
    </div>
</body>
</html>
